<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Mentor Session Booking</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h2>Forgot Password</h2>
            <p class="stat-label" style="margin-bottom: 20px;">Enter your email/username to request a reset token</p>

            <form id="forgotForm">
                <div class="form-group">
                    <label for="email">Email or Username</label>
                    <input type="text" id="email" placeholder="Enter email or username" required>
                </div>

                <button type="submit" class="btn" style="width: 100%;">Get Reset Token</button>
            </form>

            <div id="message" class="message"></div>
            <div id="tokenOutput" style="margin-top: 15px; word-break: break-all; font-size: 0.85rem; background: #e0f2fe; padding: 10px; border-radius: 6px; display: none;"></div>

            <div class="auth-links">
                <p><a href="login.html">Back to Login</a></p>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        document.getElementById("forgotForm").addEventListener("submit", async function(e) {
            e.preventDefault();
            const email = document.getElementById("email").value.trim();
            const messageEl = document.getElementById("message");
            const tokenOutput = document.getElementById("tokenOutput");

            messageEl.textContent = "Processing...";
            messageEl.className = "message";
            tokenOutput.style.display = "none";

            const res = await apiCall("/auth/forgot-password", "POST", { email });

            if (!res.ok) {
                messageEl.textContent = res.error;
                messageEl.className = "message error";
                return;
            }

            messageEl.textContent = "Password reset token generated successfully!";
            messageEl.className = "message success";

            tokenOutput.style.display = "block";
            tokenOutput.innerHTML = `<strong>Development Reset Token:</strong><br><code>${res.data.dev_reset_token}</code><br><br><a href="${res.data.dev_reset_url}" class="btn btn-sm" style="margin-top: 5px;">Proceed to Reset Password Page</a>`;
        });
    </script>
</body>
</html>
