<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Mentor Session Booking</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h2>Reset Password</h2>
            <p class="stat-label" style="margin-bottom: 20px;">Enter your token and choose a new password</p>

            <form id="resetForm">
                <div class="form-group">
                    <label for="token">Reset Token</label>
                    <input type="text" id="token" placeholder="Paste reset token" required>
                </div>

                <div class="form-group">
                    <label for="new_password">New Password</label>
                    <input type="password" id="new_password" placeholder="Enter new password" required>
                </div>

                <button type="submit" class="btn" style="width: 100%;">Reset Password</button>
            </form>

            <div id="message" class="message"></div>

            <div class="auth-links">
                <p><a href="login.html">Back to Login</a></p>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        // Pre-fill token from query param if present
        const urlParams = new URLSearchParams(window.location.search);
        const tokenParam = urlParams.get("token");
        if (tokenParam) {
            document.getElementById("token").value = tokenParam;
        }

        document.getElementById("resetForm").addEventListener("submit", async function(e) {
            e.preventDefault();
            const token = document.getElementById("token").value.trim();
            const new_password = document.getElementById("new_password").value;
            const messageEl = document.getElementById("message");

            messageEl.textContent = "Updating password...";
            messageEl.className = "message";

            const res = await apiCall("/auth/reset-password", "POST", { token, new_password });

            if (!res.ok) {
                messageEl.textContent = res.error;
                messageEl.className = "message error";
                return;
            }

            messageEl.textContent = "Password reset successfully! Redirecting to login...";
            messageEl.className = "message success";

            setTimeout(() => {
                window.location.href = "login.html";
            }, 1200);
        });
    </script>
</body>
</html>
